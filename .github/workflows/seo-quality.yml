name: SEO and GEO quality
on:
  push:
    branches: ['**']
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: npm run verify
      - run: npm run seo:prepare
      - run: npm run build:production
