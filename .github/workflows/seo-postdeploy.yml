name: Production SEO post-deploy
on:
  workflow_dispatch:
  repository_dispatch:
    types: [production-deployed]
permissions:
  contents: read
jobs:
  verify-and-notify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: npm run seo:postdeploy
