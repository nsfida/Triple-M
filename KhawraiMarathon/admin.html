<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin - Khawrai Marathon Season Three</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;600&family=Barlow+Condensed:wght@700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
<style>
.top .in{padding:22px 20px 30px}.top h1{font-size:2.4rem}
.login{max-width:380px;margin:9vh auto;background:#fff;padding:26px;border-radius:12px;box-shadow:0 8px 24px rgba(20,40,30,.12);border-top:10px solid var(--yellow)}
.login label{display:block;font-weight:600;margin-top:12px}.login input{width:100%;padding:.6rem;border:2px solid var(--line);border-radius:8px;font:inherit}
.login input:focus{border-color:var(--green);outline:0}
.tools{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:14px 0}.tools .sp{margin-left:auto}
.rt{border-collapse:collapse;width:100%;min-width:900px}.rt th,.rt td{padding:.6rem .75rem;text-align:left;border-bottom:1px solid var(--line);vertical-align:middle}
.rt th{background:var(--asphalt);color:#fff;font-weight:600;position:sticky;top:0}.rt tbody tr:hover{background:#f7faf8}
.rt td img{width:38px;height:48px;object-fit:cover;border-radius:3px;background:#dde6e2}
.acts{display:flex;gap:6px;flex-wrap:wrap}.rt small{color:var(--muted)}
.tabs{display:flex;gap:6px;margin:6px 0 4px}.tabs button{border:0;background:#e2eae6;border-radius:99px;padding:.45rem 1.2rem;font:600 1rem "Barlow";cursor:pointer;color:var(--muted)}.tabs button[aria-pressed=true]{background:var(--asphalt);color:#fff}
.ftot{font:800 1.8rem "Barlow Condensed"}
</style>
</head>
<body>
<header class="top"><div class="in"><div><h1>Admin</h1><p>Khawrai Marathon Race Season Three registrations</p></div><div class="cta"><a class="btn ghost" style="color:#fff;box-shadow:inset 0 0 0 2px #5c6b65" href="index.html">Public list</a></div></div></header>

<form class="login" id="login" hidden><h2 style="font-size:1.8rem">Sign in</h2>
  <label for="u">Username</label><input id="u" autocomplete="username" required>
  <label for="p">Password</label><input id="p" type="password" autocomplete="current-password" required>
  <p class="msg bad" id="lerr" hidden></p><p><button class="btn" style="width:100%" id="lgo">Sign in</button></p>
  <p style="color:var(--muted);font-size:.9rem;margin:0">You stay signed in on this device until you press Sign out.</p></form>

<main class="wrap" id="app" hidden>
  <div class="tools"><b id="who"></b><span id="role" class="tag pending"></span><span class="sp"><a class="btn sm" href="register.html">Add registration</a> <button class="btn ghost sm" id="out">Sign out</button></span></div>
  <div class="tabs" role="group" aria-label="Sections"><button id="tabR" aria-pressed="true">Registrations</button><button id="tabF" aria-pressed="false">Project funds</button></div>
  <section id="paneR">
    <div class="tools"><button class="btn alt sm" id="dlSel">Download selected PDF</button><button class="btn sm" id="dlAll">Download all PDF</button></div>
    <p class="msg" id="info" aria-live="polite">Loading…</p>
    <div class="tw"><table class="rt"><thead><tr><th><input type="checkbox" id="selAll" aria-label="Select all"></th><th></th><th>Reg No</th><th>Name</th><th>Age</th><th>CNIC</th><th>Mobile</th><th>Payment ref</th><th>Status</th><th>Actions</th></tr></thead><tbody id="tb"></tbody></table></div>
  </section>
  <section id="paneF" hidden>
    <div class="tools"><button class="btn" id="addFund">Funds received</button><span class="ftot" id="ftot"></span></div>
    <p class="msg" id="finfo" aria-live="polite">Loading…</p>
    <div class="tw"><table class="ft" style="min-width:700px"><thead><tr><th>#</th><th>Name</th><th>Mohallah</th><th class="amt">Amount (Rs.)</th><th>Type</th><th>Received by</th><th>Date</th><th></th></tr></thead><tbody id="fb"></tbody></table></div>
  </section>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="js/config.js"></script><script src="js/common.js"></script><script src="js/admin-tools.js"></script>
<script>
const $ = id => document.getElementById(id), C = KMR;
let rows = [], funds = [], user = "";
function say(t, bad) { $("info").textContent = t; $("info").className = "msg" + (bad ? " bad" : ""); }

// ----- sign in: the session is stored locally and shared with the public list and the register page -----
$("login").onsubmit = async e => {
  e.preventDefault(); $("lerr").hidden = true; $("lgo").disabled = true;
  const r = await KMRAuth.signIn($("u").value, $("p").value); $("lgo").disabled = false;
  if (r.error) { $("lerr").textContent = r.error; $("lerr").hidden = false; return; }
  $("p").value = ""; show(r.user);
};
$("out").onclick = async () => { await KMRAuth.signOut(); show(""); };
function show(u) {
  if (u === user && show.done) return; show.done = true; user = u;
  $("login").hidden = !!u; $("app").hidden = !u; if (!u) { rows = []; funds = []; return $("u").focus(); }
  KMRAdmin.init(); $("who").textContent = u; $("role").textContent = "Admin: can confirm, edit, delete and download";
  load(); loadFunds();
}
KMRAuth.onChange(show);
(async () => show(await KMRAuth.current()))();

// ----- registrations -----
async function load() {
  const { data, error } = await sb.from("registrations").select("*").order("created_at", { ascending: true });
  if (error) return say("Could not load registrations: " + error.message, true);
  rows = data; draw();
}
function draw() {
  const c = rows.filter(r => r.status === "confirmed").length;
  say(`${rows.length} registrations · ${c} confirmed · ${rows.length - c} pending`);
  $("tb").innerHTML = rows.map(r => `<tr data-id="${r.id}">
    <td><input type="checkbox" class="sel" aria-label="Select ${esc(r.name)}"></td><td><img alt="" src="${esc(photoUrl(r.photo_path))}"></td>
    <td><b>${esc(r.reg_no)}</b></td><td>${esc(r.name)}<br><small>${esc(r.father_name)}${r.entered_by ? " · added by " + esc(r.entered_by) : ""}</small></td><td>${ageOf(r.dob)}</td><td>${esc(r.cnic)}</td><td>${esc(r.mobile)}</td><td>${esc(r.payment_ref || "—")}</td>
    <td><span class="tag ${r.status}">${r.status === "confirmed" ? "Confirmed" : "Pending"}</span></td>
    <td><div class="acts"><button class="btn sm alt" data-a="pdf">PDF</button><button class="btn sm ghost" data-a="docs">Files</button><button class="btn sm ghost" data-a="edit">Edit</button>
    <button class="btn sm" data-a="toggle">${r.status === "confirmed" ? "Mark pending" : "Confirm payment"}</button><button class="btn sm danger" data-a="del">Delete</button></div></td></tr>`).join("") || `<tr><td colspan="10">No registrations yet.</td></tr>`;
}
const both = () => { load(); loadFunds(); };
$("selAll").onchange = e => document.querySelectorAll(".sel").forEach(x => x.checked = e.target.checked);
$("dlAll").onclick = e => rows.length ? KMRAdmin.pdf(rows, "Khawrai-S3-all-registrations.pdf", e.target) : say("Nothing to download yet.", true);
$("dlSel").onclick = e => {
  const ids = [...document.querySelectorAll(".sel:checked")].map(x => x.closest("tr").dataset.id);
  ids.length ? KMRAdmin.pdf(rows.filter(r => ids.includes(r.id)), "Khawrai-S3-selected-registrations.pdf", e.target) : say("Tick at least one registration first.", true);
};
$("tb").onclick = e => {
  const b = e.target.closest("button[data-a]"); if (!b) return;
  const r = rows.find(x => x.id === b.closest("tr").dataset.id), a = b.dataset.a;
  if (a === "pdf") KMRAdmin.pdf([r], `${r.reg_no}_${slug(r.name)}.pdf`, b);
  else if (a === "docs") KMRAdmin.details(r, rows);
  else if (a === "edit") KMRAdmin.edit(r, draw);
  else if (a === "toggle") r.status === "confirmed" ? KMRAdmin.unconfirm(r, both) : KMRAdmin.pay(r, both);
  else if (a === "del") KMRAdmin.remove(r, both);
};

// ----- tabs -----
function tab(f) { $("paneR").hidden = f; $("paneF").hidden = !f; $("tabR").setAttribute("aria-pressed", !f); $("tabF").setAttribute("aria-pressed", f); }
$("tabR").onclick = () => tab(false); $("tabF").onclick = () => tab(true);

// ----- project funds -----
async function loadFunds() {
  const { data, error } = await sb.from("funds").select("*").order("created_at", { ascending: true });
  if (error) { $("finfo").textContent = "Could not load funds: " + error.message; $("finfo").className = "msg bad"; return; }
  funds = data; drawFunds();
}
function drawFunds() {
  const total = funds.reduce((t, f) => t + Number(f.amount), 0), reg = funds.filter(f => f.source === "registration").reduce((t, f) => t + Number(f.amount), 0);
  $("ftot").textContent = "Total " + rs(total); $("finfo").className = "msg";
  $("finfo").textContent = `${funds.length} entries · ${rs(total - reg)} donations · ${rs(reg)} entry fees`;
  $("fb").innerHTML = funds.map((f, i) => `<tr data-id="${f.id}"><td>${i + 1}</td><td>${esc(f.donor_name)}</td><td>${esc(f.mohallah)}</td><td class="amt"><b>${Number(f.amount).toLocaleString("en-US")}</b></td>
    <td>${f.source === "registration" ? "Entry fee " + esc(f.reference || "") : "Donation"}</td><td>${esc(f.recorded_by)}</td><td>${fmtDate(f.created_at)}</td>
    <td>${f.source === "donation" ? '<div class="acts"><button class="btn sm ghost" data-fe>Edit</button><button class="btn sm danger" data-fd>Delete</button></div>' : ""}</td></tr>`).join("") || '<tr><td colspan="8">No funds recorded yet.</td></tr>';
}
$("addFund").onclick = () => KMRAdmin.fund(null, loadFunds);
$("fb").onclick = e => {
  const b = e.target.closest("[data-fe],[data-fd]"); if (!b) return; const f = funds.find(x => x.id === b.closest("tr").dataset.id);
  b.hasAttribute("data-fe") ? KMRAdmin.fund(f, loadFunds) : KMRAdmin.removeFund(f, loadFunds);
};
</script>
</body></html>
