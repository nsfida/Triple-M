<svg id="triplem-vip-logo" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 895 750" shape-rendering="geometricPrecision" role="img" aria-label="Triple M VIP logo" xmlns:c2pa="http://c2pa.org/manifest">
  <style>
    .fx { transform-box: fill-box; transform-origin: center; }

    /* ================= 1. OUTLINE DRAW-ON (strokes trace each shape, then fade) ================= */
    .draw { fill: none; stroke-width: 3.2; stroke-linejoin: round; stroke-dasharray: 1; stroke-dashoffset: 1; opacity: 0;
            animation: draw 1.9s cubic-bezier(.65,0,.25,1) var(--d) both; }
    @keyframes draw {
      0%   { stroke-dashoffset: 1; opacity: 1; }
      60%  { stroke-dashoffset: 0; opacity: 1; }
      100% { stroke-dashoffset: 0; opacity: 0; }
    }

    /* ================= 2. FILL FADES IN BEHIND THE OUTLINE ================= */
    @keyframes fillIn { from { opacity: 0; } }
    .fill { animation: fillIn .7s ease-out var(--d) backwards; }

    /* ================= 3. GOLD DIAMOND: POP + FLASH ================= */
    @keyframes pop {
      0%   { opacity: 0; transform: scale(.2) rotate(-25deg); }
      55%  { opacity: 1; transform: scale(1.22) rotate(5deg); filter: drop-shadow(0 0 26px #ffd86b); }
      100% { transform: none; filter: drop-shadow(0 0 0 rgba(255,216,107,0)); }
    }
    .gem { animation: pop 1s cubic-bezier(.3,1.2,.4,1) 1.9s backwards; }

    /* ================= 4. SHOCKWAVE RINGS FROM THE DIAMOND (repeat) ================= */
    .ring { fill: none; stroke: #e6b95a; stroke-width: 3; opacity: 0;
            animation: ring 6s cubic-bezier(.2,.7,.3,1) var(--d) infinite; }
    @keyframes ring {
      0%   { opacity: .9; transform: scale(1); }
      22%  { opacity: 0;  transform: scale(2.6); }
      100% { opacity: 0;  transform: scale(2.6); }
    }

    /* ================= 5. LIGHT COMETS RUN ALONG THE OUTLINES (repeat) ================= */
    .comet { fill: none; stroke-linecap: round; opacity: 0; }
    .teal-comet { stroke: #7ff7ef; filter: drop-shadow(0 0 5px #3de8de); }
    .gold-comet { stroke: #fff4cc; filter: drop-shadow(0 0 5px #ffd86b); }
    .tail { stroke-width: 2.2; stroke-dasharray: .2 .8;   animation: tail 6s linear var(--d) infinite; }
    .head { stroke-width: 5.5; stroke-dasharray: .035 .965; animation: head 6s linear var(--d) infinite; }
    @keyframes tail { 0% { stroke-dashoffset: 0;    opacity: 0; } 4% { opacity: .75; } 56% { opacity: .75; } 60%,100% { stroke-dashoffset: -1;    opacity: 0; } }
    @keyframes head { 0% { stroke-dashoffset: -.165; opacity: 0; } 4% { opacity: 1;   } 56% { opacity: 1;   } 60%,100% { stroke-dashoffset: -1.165; opacity: 0; } }

    /* ================= 6. SPARKLES TWINKLE ================= */
    .spark { fill: #ffe9a6; opacity: 0; filter: drop-shadow(0 0 4px #e6b95a) drop-shadow(0 0 9px #ffd86b);
             animation: twinkle 4.8s ease-in-out var(--d) infinite; }
    @keyframes twinkle {
      0%   { opacity: 0; transform: scale(0) rotate(0deg); }
      10%  { opacity: 1; transform: scale(1) rotate(45deg); }
      22%  { opacity: 0; transform: scale(0) rotate(90deg); }
      100% { opacity: 0; transform: scale(0) rotate(90deg); }
    }

    /* ================= 7. GLASS SHINE SWEEP, CLIPPED TO THE LOGO (repeat) ================= */
    .sweep { opacity: 0; animation: sweep 6s cubic-bezier(.45,0,.25,1) 2.6s infinite; }
    @keyframes sweep {
      0%   { opacity: 1; transform: translateX(-300px); }
      32%  { opacity: 1; transform: translateX(1250px); }
      33%,100% { opacity: 0; transform: translateX(1250px); }
    }

    /* ================= 8. GOLD GENTLY BREATHES ================= */
    .breathe { animation: breathe 3.6s ease-in-out 3s infinite; }
    @keyframes breathe { 50% { filter: drop-shadow(0 0 10px rgba(255,216,107,.85)); } }

    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; }
      .draw, .comet, .ring, .spark, .sweep { opacity: 0 !important; }
    }
  </style>

  <defs>
    <!-- original path data, unchanged -->
    <path id="t1" pathLength="1" d="M448,30L635,210l-69,68L448,164L330,278l-69-68L448,30Z" transform="matrix(1.065078 0 0 0.947487 -29.154944 41.087002)"/>
    <path id="t2" pathLength="1" d="M35,70L448,428L860,70v138L448,556L35,208v-138Z"/>
    <path id="t3" pathLength="1" d="M35,246L268.400389,460.042831L276,599l-50-36v-85L115,383v277L35,718v-472Z"/>
    <path id="t4" pathLength="1" d="M35,246L267.292868,460.042831L276,599l-50-36v-85L115,383v277L35,718v-472Z" transform="matrix(-1 0 0 1 897 0)"/>
    <path id="t5" pathLength="1" d="M282,483L447.5,635.914441L613,483v29L448,667.041485L282,512v-29Z" transform="translate(0 -13)"/>
    <path id="g1" pathLength="1" d="M448,181L550,283L448,385L346,283L448,181Z" transform="matrix(1.397871 0 0 1 -178.246208 -17)"/>
    <path id="g2" pathLength="1" d="M103,303L448,566L792,303h-32L448,522L136,303h-33Z"/>
    <path id="g3" pathLength="1" d="M151,508l91,74v118l-91-56v-136Z" transform="matrix(1.237819 0 0 1.08964 -130.596962 -199.687933)"/>
    <path id="g4" pathLength="1" d="M151,508l91,74v118l-91-56v-136Z" transform="matrix(-1.237819 0 0 1.08964 1026.666019 -199.687933)"/>

    <path id="star" d="M0,-10C1,-2 2,-1 10,0C2,1 1,2 0,10C-1,2 -2,1 -10,0C-2,-1 -1,-2 0,-10Z"/>

    <linearGradient id="shineGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0"   stop-color="#fff" stop-opacity="0"/>
      <stop offset=".5"  stop-color="#fff" stop-opacity=".85"/>
      <stop offset="1"   stop-color="#fff" stop-opacity="0"/>
    </linearGradient>

    <mask id="logoMask" maskUnits="userSpaceOnUse" x="0" y="0" width="895" height="750" style="mask-type:alpha">
      <g fill="#fff">
        <use href="#t1"/><use href="#t2"/><use href="#t3"/><use href="#t4"/><use href="#t5"/>
        <g transform="matrix(0.830352 0 0 1 76.41748 46)"><use href="#g1"/><use href="#g2"/><use href="#g3"/><use href="#g4"/></g>
      </g>
    </mask>
  </defs>

  <!-- ===================== TEAL ===================== -->
  <g>
    <g class="fill" style="--d:1.0s"><use href="#t1" fill="#0b7377"/></g>
    <g class="fill" style="--d:1.1s"><use href="#t2" fill="#0b7377"/></g>
    <g class="fill" style="--d:1.25s"><use href="#t3" fill="#0b7377"/><use href="#t4" fill="#0b7377"/></g>
    <g class="fill" style="--d:1.4s"><use href="#t5" fill="#0b7377"/></g>

    <use href="#t1" class="draw" stroke="#14b3b8" style="--d:0s"/>
    <use href="#t2" class="draw" stroke="#14b3b8" style="--d:.15s"/>
    <use href="#t3" class="draw" stroke="#14b3b8" style="--d:.3s"/>
    <use href="#t4" class="draw" stroke="#14b3b8" style="--d:.3s"/>
    <use href="#t5" class="draw" stroke="#14b3b8" style="--d:.45s"/>
  </g>

  <!-- ===================== GOLD ===================== -->
  <g transform="matrix(0.830352 0 0 1 76.41748 46)">
    <g class="breathe">
      <g class="fill" style="--d:1.6s"><use href="#g2" fill="#e6b95a"/></g>
      <g class="fill" style="--d:1.7s"><use href="#g3" fill="#e6b95a"/><use href="#g4" fill="#e6b95a"/></g>
    </g>
    <g class="fx gem"><use href="#g1" fill="#e6b95a"/></g>

    <use href="#g2" class="draw" stroke="#e6b95a" style="--d:.6s"/>
    <use href="#g3" class="draw" stroke="#e6b95a" style="--d:.7s"/>
    <use href="#g4" class="draw" stroke="#e6b95a" style="--d:.7s"/>
    <use href="#g1" class="draw" stroke="#e6b95a" style="--d:.8s"/>

    <!-- shockwave rings -->
    <g class="fx ring" style="--d:2.2s"><use href="#g1"/></g>
    <g class="fx ring" style="--d:2.45s"><use href="#g1"/></g>
  </g>

  <!-- ===================== COMETS ===================== -->
  <g>
    <use href="#t1" class="comet teal-comet tail" style="--d:2.6s"/><use href="#t1" class="comet teal-comet head" style="--d:2.6s"/>
    <use href="#t2" class="comet teal-comet tail" style="--d:2.8s"/><use href="#t2" class="comet teal-comet head" style="--d:2.8s"/>
    <use href="#t3" class="comet teal-comet tail" style="--d:3.0s"/><use href="#t3" class="comet teal-comet head" style="--d:3.0s"/>
    <use href="#t4" class="comet teal-comet tail" style="--d:3.0s"/><use href="#t4" class="comet teal-comet head" style="--d:3.0s"/>
    <use href="#t5" class="comet teal-comet tail" style="--d:3.2s"/><use href="#t5" class="comet teal-comet head" style="--d:3.2s"/>
  </g>
  <g transform="matrix(0.830352 0 0 1 76.41748 46)">
    <use href="#g2" class="comet gold-comet tail" style="--d:3.4s"/><use href="#g2" class="comet gold-comet head" style="--d:3.4s"/>
    <use href="#g1" class="comet gold-comet tail" style="--d:3.6s"/><use href="#g1" class="comet gold-comet head" style="--d:3.6s"/>
  </g>

  <!-- ===================== SPARKLES ===================== -->
  <g>
    <g transform="translate(448 210) scale(1.4)"><use href="#star" class="fx spark" style="--d:2.9s"/></g>
    <g transform="translate(567 312) scale(1.0)"><use href="#star" class="fx spark" style="--d:3.7s"/></g>
    <g transform="translate(330 312) scale(1.0)"><use href="#star" class="fx spark" style="--d:4.3s"/></g>
    <g transform="translate(448 312) scale(1.9)"><use href="#star" class="fx spark" style="--d:3.3s"/></g>
    <g transform="translate(162 349) scale(1.1)"><use href="#star" class="fx spark" style="--d:5.0s"/></g>
    <g transform="translate(734 349) scale(1.1)"><use href="#star" class="fx spark" style="--d:4.0s"/></g>
    <g transform="translate(448 612) scale(1.3)"><use href="#star" class="fx spark" style="--d:4.7s"/></g>
  </g>

  <!-- ===================== SHINE ===================== -->
  <g mask="url(#logoMask)">
    <g transform="skewX(-20)">
      <rect class="sweep" x="0" y="-50" width="170" height="850" fill="url(#shineGrad)"/>
    </g>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
