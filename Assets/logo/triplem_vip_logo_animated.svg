<svg id="triplem-vip-logo" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 895 750" shape-rendering="geometricPrecision" text-rendering="geometricPrecision" role="img" aria-label="Triple M VIP logo" xmlns:c2pa="http://c2pa.org/manifest">
  <style>
    /* every piece animates through its own wrapper group, so the original path data and transforms stay untouched */
    .piece { transform-box: fill-box; transform-origin: center; animation-fill-mode: both; animation-timing-function: cubic-bezier(.2,.8,.2,1); animation-duration: 1s; }

    /* ---- Intro: pieces glide in from their own side ---- */
    @keyframes fromTop    { from { opacity:0; transform: translateY(-60px); } to { opacity:1; transform:none; } }
    @keyframes fromBottom { from { opacity:0; transform: translateY(60px);  } to { opacity:1; transform:none; } }
    @keyframes fromLeft   { from { opacity:0; transform: translateX(-70px); } to { opacity:1; transform:none; } }
    @keyframes fromRight  { from { opacity:0; transform: translateX(70px);  } to { opacity:1; transform:none; } }
    @keyframes stretchIn  { from { opacity:0; transform: scaleX(.05); }       to { opacity:1; transform:none; } }
    @keyframes pop        { 0% { opacity:0; transform: scale(.1) rotate(-20deg); }
                            60% { opacity:1; transform: scale(1.18) rotate(4deg); }
                            100% { opacity:1; transform:none; } }

    .crown { animation-name: fromTop;    animation-delay: .00s; }
    .band  { animation-name: stretchIn;  animation-delay: .15s; animation-duration: 1.1s; }
    .wingL { animation-name: fromLeft;   animation-delay: .35s; }
    .wingR { animation-name: fromRight;  animation-delay: .35s; }
    .base  { animation-name: fromBottom; animation-delay: .55s; }
    .gline { animation-name: stretchIn;  animation-delay: .80s; animation-duration: 1.1s; }
    .gside { animation-name: fromBottom; animation-delay: .95s; }
    .gem   { animation-name: pop;        animation-delay: 1.10s; animation-duration: 1s; animation-timing-function: cubic-bezier(.3,1.2,.4,1); }

    /* ---- Loop 1: the gold diamond breathes with a soft glow ---- */
    @keyframes glow {
      0%,100% { filter: drop-shadow(0 0 0 rgba(230,185,90,0)); }
      50%     { filter: drop-shadow(0 0 14px rgba(230,185,90,.9)); }
    }
    .gem-glow { transform-box: fill-box; transform-origin: center; animation: glow 3.2s ease-in-out 2.4s infinite; }

    /* ---- Loop 2: gold accents get a gentle pulse of light ---- */
    @keyframes goldPulse { 0%,100% { opacity:1; } 50% { opacity:.78; } }
    .gold-pulse { animation: goldPulse 3.2s ease-in-out 2.4s infinite; }

    /* ---- Loop 3: a light sweep glides across the logo ---- */
    @keyframes sweep {
      0%        { transform: translateX(-700px); }
      35%, 100% { transform: translateX(1500px); }
    }
    .sweep { animation: sweep 5.5s ease-in-out 2.4s infinite; transform: translateX(-700px); }
    .shine-layer { opacity: 0; animation: shineIn .01s linear 2.4s forwards; }
    @keyframes shineIn { to { opacity: 1; } }

    @media (prefers-reduced-motion: reduce) {
      .piece, .gem-glow, .gold-pulse, .sweep, .shine-layer { animation: none !important; opacity: 1; }
      .shine-layer { opacity: 0; }
    }
  </style>

  <defs>
    <linearGradient id="shineGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0"   stop-color="#fff" stop-opacity="0"/>
      <stop offset=".5"  stop-color="#fff" stop-opacity=".75"/>
      <stop offset="1"   stop-color="#fff" stop-opacity="0"/>
    </linearGradient>

    <!-- the logo's own silhouette, so the shine only appears on the logo itself -->
    <mask id="logoMask" maskUnits="userSpaceOnUse" x="0" y="0" width="895" height="750" style="mask-type:alpha">
      <g fill="#fff">
        <path d="M448,30L635,210l-69,68L448,164L330,278l-69-68L448,30Z" transform="matrix(1.065078 0 0 0.947487 -29.154944 41.087002)"/>
        <path d="M35,70L448,428L860,70v138L448,556L35,208v-138Z"/>
        <path d="M35,246L268.400389,460.042831L276,599l-50-36v-85L115,383v277L35,718v-472Z"/>
        <path d="M35,246L267.292868,460.042831L276,599l-50-36v-85L115,383v277L35,718v-472Z" transform="matrix(-1 0 0 1 897 0)"/>
        <path d="M282,483L447.5,635.914441L613,483v29L448,667.041485L282,512v-29Z" transform="translate(0 -13)"/>
        <g transform="matrix(0.830352 0 0 1 76.41748 46)">
          <path d="M448,181L550,283L448,385L346,283L448,181Z" transform="matrix(1.397871 0 0 1 -178.246208 -17)"/>
          <path d="M103,303L448,566L792,303h-32L448,522L136,303h-33Z"/>
          <path d="M151,508l91,74v118l-91-56v-136Z" transform="matrix(1.237819 0 0 1.08964 -130.596962 -199.687933)"/>
          <path d="M151,508l91,74v118l-91-56v-136Z" transform="matrix(-1.237819 0 0 1.08964 1026.666019 -199.687933)"/>
        </g>
      </g>
    </mask>
  </defs>

  <!-- ===== Teal body (original shapes, unchanged) ===== -->
  <g>
    <g class="piece crown"><path d="M448,30L635,210l-69,68L448,164L330,278l-69-68L448,30Z" transform="matrix(1.065078 0 0 0.947487 -29.154944 41.087002)" fill="#0b7377"/></g>
    <g class="piece band"><path d="M35,70L448,428L860,70v138L448,556L35,208v-138Z" fill="#0b7377"/></g>
    <g class="piece wingL"><path d="M35,246L268.400389,460.042831L276,599l-50-36v-85L115,383v277L35,718v-472Z" fill="#0b7377"/></g>
    <g class="piece wingR"><path d="M35,246L267.292868,460.042831L276,599l-50-36v-85L115,383v277L35,718v-472Z" transform="matrix(-1 0 0 1 897 0)" fill="#0b7377"/></g>
    <g class="piece base"><path d="M282,483L447.5,635.914441L613,483v29L448,667.041485L282,512v-29Z" transform="translate(0 -13)" fill="#0b7377"/></g>
  </g>

  <!-- ===== Gold details (original shapes, unchanged) ===== -->
  <g transform="matrix(0.830352 0 0 1 76.41748 46)">
    <g class="gold-pulse">
      <g class="piece gline"><path d="M103,303L448,566L792,303h-32L448,522L136,303h-33Z" fill="#e6b95a"/></g>
      <g class="piece gside"><path d="M151,508l91,74v118l-91-56v-136Z" transform="matrix(1.237819 0 0 1.08964 -130.596962 -199.687933)" fill="#e6b95a"/><path d="M151,508l91,74v118l-91-56v-136Z" transform="matrix(1.237819 0 0 1.08964 -130.596962 -199.687933)" fill="#e6b95a"/></g>
      <g class="piece gside"><path d="M151,508l91,74v118l-91-56v-136Z" transform="matrix(-1.237819 0 0 1.08964 1026.666019 -199.687933)" fill="#e6b95a"/></g>
    </g>
    <g class="gem-glow">
      <g class="piece gem"><path d="M448,181L550,283L448,385L346,283L448,181Z" transform="matrix(1.397871 0 0 1 -178.246208 -17)" fill="#e6b95a"/></g>
    </g>
  </g>

  <!-- ===== Light sweep, clipped to the logo shape ===== -->
  <g class="shine-layer" mask="url(#logoMask)">
    <g transform="skewX(-20)">
      <rect class="sweep" x="0" y="-50" width="140" height="850" fill="url(#shineGrad)"/>
    </g>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
